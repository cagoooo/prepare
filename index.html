    <script>
        // 舊頁面指向已被新版刪除的檔案時（換版後的 404），自動清除快取重新載入一次
        window.addEventListener('error', function (event) {
            var el = event.target;
            var src = el && (el.src || el.href);
            if (!src || String(src).indexOf('/assets/') === -1) return;
            try {
                if (sessionStorage.getItem('prepare-asset-reload') === '1') return;
                sessionStorage.setItem('prepare-asset-reload', '1');
            } catch (e) { }
            var jobs = [];
            if ('serviceWorker' in navigator) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                }));
            }
            if (window.caches) {
                jobs.push(caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }));
            }
            Promise.all(jobs).catch(function () { }).then(function () { location.reload(); });
        }, true);
    </script>
